[project]
name = "esm_p00"
version = "0.0.1"
description = "Minimal forward P00 model for electrochemical strain microscopy: four independent analytical mechanisms and one linear detector."
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pydantic>=2.6",
    "langgraph>=0.2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "matplotlib>=3.8", "ipykernel>=6", "jupyterlab>=4"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["esm_p00*", "material_state*"]
